name: Publish to PyPI

# Publishes vac-cli to PyPI via OIDC Trusted Publishing (no API token stored).
# Runs when you publish a GitHub Release (recommended) or push a v* tag.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi          # must match the Environment name on PyPI
    permissions:
      id-token: write          # REQUIRED for Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No 'password' / token: the action uses OIDC when id-token: write is set
        # and a Trusted Publisher is configured on PyPI for this repo+workflow.
